[package]
name = "desktop-pet"
version = "0.1.0"
description = "Rolo — a desktop pet"
authors = ["Lara Washington"]
edition = "2021"

[lib]
name = "desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
log = "0.4"
env_logger = "0.11"
trash = "5"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
png = "0.17"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "v7"] }
async-trait = "0.1"
futures-util = "0.3"
urlencoding = "2"
ureq = { version = "3", features = ["json"] }
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
lru = "0.12"
sha2 = "0.10"
unicode-normalization = "0.1"
tracing = "0.1"
regex = "1.12.3"
arc-swap = "1.7"
notify = "6.1"

[dev-dependencies]
tempfile = "3"
mockito = "1"
pretty_assertions = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSPasteboard", "NSApplication", "NSWindow", "NSResponder", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSString", "NSThread"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
